# Flatpak manifest for the single-file bundle attached to every GitHub release
# (scrim-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (scrim-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# design.scrim.app.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: design.scrim.app
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: figcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Pictures and Documents are granted so files passed by path (the command
  # line, Open Recent, "Save" next to the original) work in the usual places.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network design.scrim.app` exposes it to
  # host agents) and home/host filesystem access.
modules:
  - name: figcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/figcraft /app/bin/figcraft
      # The headless CLI, scrim, and its old name figcraft-cli (an alias), in tarballs built with
      # apps/figcraft-cli.
      - if [ -x bin/scrim ]; then install -Dm755 bin/scrim /app/bin/scrim; fi
      - if [ -x bin/figcraft-cli ]; then install -Dm755 bin/figcraft-cli /app/bin/figcraft-cli; fi
      - install -Dm644 share/applications/design.scrim.app.desktop /app/share/applications/design.scrim.app.desktop
      # .figcraft; the runtime's shared-mime-info already knows SVG, PNG and JPEG.
      - install -Dm644 share/mime/packages/design.scrim.app.xml /app/share/mime/packages/design.scrim.app.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/design.scrim.app.metainfo.xml /app/share/metainfo/design.scrim.app.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/figcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
