[package]
name = "figcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Scrim command line (`scrim`): info, export, convert, render, query, lint, scripted commands, MCP server, perf"

# `scrim` is the command people type; `figcraft-cli` is its old name, kept as a thin alias that says
# so and runs `scrim` (docs/design/rebrand.md, A3).
[[bin]]
name = "scrim"
path = "src/main.rs"

[[bin]]
name = "figcraft-cli"
path = "src/alias.rs"

[lints]
workspace = true

[dependencies]
figcraft-engine = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-render = { workspace = true }
figcraft-text = { workspace = true }
figcraft-svg = { workspace = true }
figcraft-format = { workspace = true }
figcraft-mcp = { workspace = true }
serde_json = { workspace = true }
